services:

  # ==========================================================
  # LiteLLM Proxy (Latest Verified Release: v1.99.1)
  # ==========================================================

  litellm:
    image: ghcr.io/berriai/litellm:v1.99.1

    container_name: omo-litellm

    restart: unless-stopped

    env_file:
      - .env

    environment:
      STORE_MODEL_IN_DB: "True"

    ports:
      - "127.0.0.1:4000:4000"

    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro

    command:
      - "--config"
      - "/app/config.yaml"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >
          python3 -c
          "import urllib.request;
          urllib.request.urlopen('http://localhost:4000/health/liveliness')"

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

    networks:
      - gateway

    security_opt:
      - no-new-privileges:true


  # ==========================================================
  # PostgreSQL (Single DB for Dynamic Models & Admin UI)
  # ==========================================================

  postgres:
    image: postgres:16-alpine

    container_name: omo-litellm-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - litellm_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - >
          pg_isready
          -U ${POSTGRES_USER}
          -d ${POSTGRES_DB}

      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - gateway

    security_opt:
      - no-new-privileges:true


# ============================================================
# Network
# ============================================================

networks:

  gateway:
    driver: bridge


# ============================================================
# Persistent volumes
# ============================================================

volumes:

  litellm_postgres:
    name: omo_litellm_postgres
